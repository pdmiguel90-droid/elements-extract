app-id: io.github.tuusuario.FFmpegExtractor
runtime: org.kde.Platform
runtime-version: '5.15'
sdk: org.kde.Sdk
command: ffmpeg-extractor

# Permisos del sandbox
finish-args:
  # Acceso a archivos del usuario (necesario para abrir/guardar)
  - --filesystem=home
  # Acceso al sistema de ventanas
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  # Para abrir carpetas en el explorador de archivos del sistema
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.la'
  - '*.a'

modules:

  # ── FFmpeg (el motor de extracción) ──────────────────────────────────────────
  # Nota: en Flathub se puede usar el módulo compartido de freedesktop-sdk,
  # o compilarlo desde fuente como aquí se muestra.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-manpages
      - --disable-debug
      - --enable-gpl
      - --enable-version3
      - --disable-encoders
      - --disable-muxers
      - --enable-encoder=copy
      - --enable-muxer=matroska
      - --enable-muxer=mp4
      - --enable-muxer=srt
      - --enable-muxer=ass
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-6.1.tar.xz
        sha256: 488c76e57dd9b3bee901f71d5c95eaf1db4a5a31c4d609ce7013b4f3040afcf2
    cleanup:
      - /share/ffmpeg/examples

  # ── La aplicación ─────────────────────────────────────────────────────────────
  - name: ffmpeg-extractor
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/tuusuario/ffmpeg-extractor.git
        tag: v1.0.0
        # Reemplaza con el commit hash real al publicar:
        # commit: abc123def456...
    post-install:
      # Instalar el binario con el nombre correcto
      - install -Dm755 FFmpegExtractor /app/bin/ffmpeg-extractor
      # Instalar el archivo .desktop
      - install -Dm644 ../ffmpeg-extractor.desktop
          /app/share/applications/io.github.tuusuario.FFmpegExtractor.desktop
      # Instalar los metadatos AppStream (requerido por Flathub)
      - install -Dm644 ../flatpak/io.github.tuusuario.FFmpegExtractor.metainfo.xml
          /app/share/metainfo/io.github.tuusuario.FFmpegExtractor.metainfo.xml
