name: watchdog

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check catalog for changes
        run: |
          python3 tools/check-model-updates.py --no-write
        continue-on-error: false