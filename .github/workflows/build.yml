name: build
  
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bergamot:
    uses: ./.github/workflows/bergamot-linux.yml

  build:
    needs: bergamot
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake qt6-base-dev ffmpeg \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Fetch bundled models via mirror
        run: |
          python3 tools/mirror-models.py --out mirror --models en-es-tiny,es-en-tiny
          for id in en-es-tiny es-en-tiny; do
            mkdir -p "models/$id"
            tar -xzf "mirror/$id.tar.gz" -C "models/$id"
          done

      - name: Download bergamot engine (built in this run)
        uses: actions/download-artifact@v8
        with:
          name: bergamot-linux64
          path: bergamot-dl

      - name: Unpack bergamot runtime
        run: |
          tar -xzf bergamot-dl/bergamot-linux64.tar.gz -C bin/
          chmod +x bin/bergamot bin/bergamot.real
          ls -la bin/

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Smoke test translation
        run: |
          cd models/es-en-tiny
          out=$(printf 'Hello world, this is a test.\n' | LD_LIBRARY_PATH=../../bin ../../bin/bergamot.real \
            --model-config-paths config.intgemm8bitalpha.yml --cpu-threads 2 2>&1 || true)
          echo "$out"
          if [ "${out%%$'\n'*}" = "Hello world, this is a test." ]; then
            echo "ERROR: salida de identidad (modelo o shortlist rotos)"; exit 1
          fi

      - name: Package .deb
        run: |
          cpack --config build/CPackConfig.cmake
          ls -lh *.deb

      - name: Checksums
        run: |
          sha256sum elements-extract-*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: elements-extract-deb
          path: |
            elements-extract-*.deb
            SHA256SUMS
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            elements-extract-*.deb
            SHA256SUMS
          generate_release_notes: true