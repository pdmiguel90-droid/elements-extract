name: bergamot-windows

# Compila el CLI de bergamot-translator para Windows (x64) y publica
# bergamot.exe como asset de release. Luego apunta la variable del repo
# BERGAMOT_WIN_URL a la URL del asset para que el workflow `windows`
# lo empaquete en el zip de la app.
on:
  workflow_dispatch:
  workflow_call:
  push:
    tags: ['bergamot-*']

permissions:
  contents: write

env:
  BERGAMOT_REF: v0.4.5
  MKL_URL: "https://data.statmt.org/romang/marian-regression-tests/ci/mkl-2020.1-windows-static.zip"

jobs:
  build-bergamot:
    runs-on: windows-2022
    steps:
      - name: Checkout bergamot-translator
        uses: actions/checkout@v7
        with:
          repository: browsermt/bergamot-translator
          ref: ${{ env.BERGAMOT_REF }}
          submodules: recursive
          path: bergamot

      # MSVC 14.4x (VS 2022 17.14, imagen windows-2022 actual) eliminó por
      # completo el no-estándar std::hash_compare (microsoft/STL#5764). El
      # protobuf-lite 3.6.1 embebido en sentencepiece lo usa, así que lo
      # definimos aquí. Es idempotente y no toca ninguna línea existente.
      - name: Patch vendored protobuf-lite (std::hash_compare)
        shell: pwsh
        run: |
          $hash = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\bergamot" -Recurse -Filter hash.h |
            Where-Object { $_.FullName -match 'protobuf-lite.*stubs[\\/]hash\.h$' } |
            Select-Object -First 1
          if (-not $hash) { Write-Error "No se encontró hash.h de protobuf-lite"; exit 1 }
          $path = $hash.FullName
          Write-Host "Parcheando $path"
          $content = Get-Content -Raw -LiteralPath $path
          if ($content -match 'msvc-hash-compare-compat') {
            Write-Host "Ya parcheado; se omite."; exit 0
          }
          $shimLines = @(
            '// msvc-hash-compare-compat: MSVC 14.4x removed std::hash_compare (microsoft/STL#5764).',
            '#if defined(_MSC_VER)',
            '#include <functional>',
            '#include <cstddef>',
            'namespace std {',
            'template <typename _HcKey, typename _HcPr = std::less<_HcKey> >',
            'struct hash_compare {',
            '  enum { bucket_size = 4, min_buckets = 8 };',
            '  _HcPr comp;',
            '  explicit hash_compare(const _HcPr& _Pred = _HcPr()) : comp(_Pred) {}',
            '  size_t operator()(const _HcKey& _Keyval) const {',
            '    return std::hash<_HcKey>()(_Keyval);',
            '  }',
            '  bool operator()(const _HcKey& _K1, const _HcKey& _K2) const {',
            '    return comp(_K1, _K2);',
            '  }',
            '};',
            '}  // namespace std',
            '#endif'
          )
          $shim = ($shimLines -join "`n") + "`n"
          $anchor = '#include <google/protobuf/stubs/common.h>'
          if ($content -notmatch [regex]::Escape($anchor)) {
            Write-Error "No se encontró el ancla de inclusión en hash.h"; exit 1
          }
          $content = $content -replace [regex]::Escape($anchor), ($anchor + "`n" + $shim)
          Set-Content -NoNewline -LiteralPath $path -Value $content
          Write-Host "Parcheado correctamente."

      - name: Download MKL (static)
        shell: pwsh
        run: |
          curl.exe -sL "$env:MKL_URL" -o mkl.zip
          Expand-Archive -Force mkl.zip "$env:GITHUB_WORKSPACE\mkl"
          "MKLROOT=$env:GITHUB_WORKSPACE\mkl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Disable vcpkg debug builds
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          $triplets = Join-Path $vcpkg 'triplets'
          Write-Host "vcpkg root: $vcpkg"
          Add-Content -Path (Join-Path $triplets 'x64-windows-static.cmake') -Value "set(VCPKG_BUILD_TYPE release)"
          Add-Content -Path (Join-Path $triplets 'x64-windows.cmake') -Value "set(VCPKG_BUILD_TYPE release)"

      - name: Install dependencies with vcpkg
        shell: pwsh
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          $env:VCPKG_BUILD_TYPE = 'release'
          $env:VCPKG_DEFAULT_TRIPLET = 'x64-windows-static'
          & (Join-Path $vcpkg 'vcpkg.exe') install protobuf:x64-windows-static pcre2:x64-windows-static

      - name: Configure
        shell: pwsh
        working-directory: ${{ github.workspace }}\bergamot
        run: |
          $vcpkg = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DUSE_STATIC_LIBS=ON `
            -DVCPKG_TARGET_TRIPLET='x64-windows-static' `
            -DCMAKE_TOOLCHAIN_FILE="$(Join-Path $vcpkg 'scripts\buildsystems\vcpkg.cmake')"

      - name: Build CLI
        shell: pwsh
        working-directory: ${{ github.workspace }}\bergamot
        run: cmake --build build --config Release --target bergamot --parallel

      - name: Verify
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\bergamot\build\app\Release\bergamot.exe"
          if (!(Test-Path $exe)) {
            Write-Error "bergamot.exe no encontrado en la ruta esperada"
            Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\bergamot\build\app" -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          & $exe --version

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\bergamot\build\app\Release\bergamot.exe" out/bergamot.exe
          Compress-Archive -Path out/* -DestinationPath bergamot-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: bergamot-win64
          path: bergamot-win64.zip
          retention-days: 30

      - name: Publish to release (tag only)
        if: startsWith(github.ref, 'refs/tags/bergamot-')
        uses: softprops/action-gh-release@v3
        with:
          files: out/bergamot.exe
          generate_release_notes: false
